<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Low-Poly City</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #game { position:fixed; inset:0; width:100%; height:100%; display:block }
    #menu { z-index:20; text-align:center; gap:14px }
    #help { max-width:440px; color:#cfd8e8; line-height:1.6 }
    #hud { position:fixed; z-index:5; left:18px; top:16px; color:#fff; font: bold 16px Arial,sans-serif; text-shadow:0 2px 4px #000; pointer-events:none }
    #status { position:fixed; z-index:5; bottom:18px; left:50%; transform:translateX(-50%); color:#fff; font: bold 15px Arial,sans-serif; text-shadow:0 2px 4px #000; pointer-events:none }
    #loaderror { max-width:560px; padding:12px; text-align:center }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading" class="overlay"><div class="logo">LOW-POLY <span>CITY</span></div><div id="loadmsg">Loading game…</div><div class="bar"><i id="loadbar"></i></div><div id="loaderror" class="hidden"></div></div>
  <div id="menu" class="overlay hidden"><div class="logo">LOW-POLY <span>CITY</span></div><div class="tagline">A small city driving demo</div><button id="start" class="btn big">Start Driving</button><div id="help">WASD or arrow keys to drive · Space to brake · R to reset</div></div>
  <div id="hud" class="hidden">LOW-POLY CITY</div><div id="status" class="hidden"></div>
  <script>
  (function () {
    var three = [
      'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
      'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
      'https://unpkg.com/three@0.128.0/build/three.min.js'
    ];
    var files = ['peds.js','player.js','interiors.js','shops.js','missions.js','audio.js','ui.js','main.js'];
    var msg = document.getElementById('loadmsg'), bar = document.getElementById('loadbar'), err = document.getElementById('loaderror');
    function fail(text) { err.textContent = text; err.classList.remove('hidden'); }
    function loadThree(i) {
      if (i === three.length) { fail('Three.js could not be downloaded. Check your internet connection and reload.'); return; }
      var s = document.createElement('script'); s.src = three[i]; s.onload = function () { loadFile(0); };
      s.onerror = function () { s.remove(); loadThree(i + 1); }; document.head.appendChild(s);
    }
    function loadFile(i) {
      if (i === files.length) { window.LowPolyGame.boot(); return; }
      msg.textContent = 'Loading ' + files[i] + '…'; bar.style.width = Math.round(i / files.length * 100) + '%';
      var s = document.createElement('script'); s.src = 'js/' + files[i];
      s.onload = function () { loadFile(i + 1); };
      s.onerror = function () { fail('Could not load js/' + files[i] + '. Verify the file exists and reload.'); };
      document.head.appendChild(s);
    }
    window.addEventListener('error', function (e) {
      if (e.message) fail('Game error: ' + e.message);
    });
    loadThree(0);
  })();
  </script>
</body>
</html>
